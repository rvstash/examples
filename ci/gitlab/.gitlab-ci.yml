stages: [test, publish]

npm-test:
  image: node:24-bookworm
  stage: test
  script:
    - cd npm
    - npm test
    - npm pack --dry-run

npm-publish:
  image: node:24-bookworm
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^npm-v/
  script:
    - curl -fsSL https://ravenstash.com/install.sh | RVS_INSTALL_METHOD=portable RVS_INSTALL_VERSION=0.15.1 bash
    - export PATH="$HOME/.local/bin:$PATH"
    - cd npm
    - rvs art select acme/packages
    - rvs npm --rvs-yes publish
