name: Publish Python package to Ravenstash

on:
  workflow_dispatch:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install rvs
        run: curl -fsSL https://ravenstash.com/install.sh | bash
      - name: Build and publish to Ravenstash
        env:
          RVS_TOKEN: ${{ secrets.RVS_TOKEN }}
        run: |
          rvs art select acme/packages
          rvs uv build
          rvs uv --rvs-yes publish
