name: Publish Python package to Ravenstash

on:
  workflow_dispatch:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Set up Ravenstash CLI
        uses: rvstash/setup-ravenstash@969c51bc762cc75cbe5707e99b63aedad7bd22da # v0.1.0
        with:
          version: "0.15.1"
      - name: Build and publish to Ravenstash
        env:
          RVS_TOKEN: ${{ secrets.RVS_TOKEN }}
        run: |
          rvs art select acme/packages
          rvs uv build
          rvs uv --rvs-yes publish
