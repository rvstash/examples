name: Publish Python package to Ravenstash

on:
  workflow_dispatch:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Set up Ravenstash CLI
        uses: rvstash/setup-ravenstash@002b67ca6eedba2e4e2bb79993075b14e53cf7fb # v0.1.1
        with:
          version: "0.17.0"
      - name: Build and publish to Ravenstash
        env:
          RVS_TOKEN: ${{ secrets.RVS_TOKEN }}
        run: |
          rvs art select acme/packages
          rvs uv build
          rvs uv --rvs-yes publish
