name: Publish npm package to Ravenstash

on:
  workflow_dispatch:
  push:
    tags: ["npm-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Set up Ravenstash CLI
        uses: rvstash/setup-ravenstash@002b67ca6eedba2e4e2bb79993075b14e53cf7fb # v0.1.1
        with:
          version: "0.17.0"
      - name: Test and inspect package
        run: |
          npm test
          npm pack --dry-run
      - name: Publish to Ravenstash
        env:
          RVS_TOKEN: ${{ secrets.RVS_TOKEN }}
        run: |
          rvs art select acme/packages
          rvs npm --rvs-yes publish
